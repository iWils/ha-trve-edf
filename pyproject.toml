[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=custom_components.trve_edf --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "PT",    # flake8-pytest-style
    "RUF",   # ruff-specific rules
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.trve_edf"]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
files = ["custom_components", "tests", ".github/scripts"]
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
# The test plugin ships no type information.
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true
